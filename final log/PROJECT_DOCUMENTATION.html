# E-Commerce Telemetry Store & Cloud Observability Dashboard
## Comprehensive System Architecture & Technical Documentation

---

## 1. Executive Summary & Project Purpose

This project is an enterprise-grade **Cloud-Native E-Commerce Platform with an integrated Real-Time Developer Monitoring & SRE Observability Dashboard**. 

Built for high availability, asynchronous telemetry delivery with controlled backpressure handling, and sub-second operational awareness, the system connects directly to **Google Cloud Platform (GCP)** services—**Cloud Run, Cloud Logging, Cloud Monitoring, and Cloud Firestore**—to provide:
1. A customer-facing e-commerce storefront with atomic, permanent sequential order tracking.
2. An SRE/DevOps monitoring control room that reads **100% genuine telemetry** from Google Cloud infrastructure without fabricated fallback values.
3. A complete incident management lifecycle featuring **Active Alerts**, a **7-Day Rolling Alert History**, and instant one-click acknowledgement.
4. Universal time synchronization in **Indian Standard Time (IST — Asia/Kolkata)** across every user-visible surface.

* **Cloud Run Service**: `cloud-monitoring` (Region: `us-central1`)

### Pillar 1: Persistent Sequential Order Counter (ACID Firestore Transaction)

#### The Problem Solved
In traditional serverless deployments, Python in-memory variables (like `order_id = 0`) reset to `1` whenever:
* The container scales to zero due to inactivity.
* A new Cloud Run instance spins up to handle traffic.
* The container restarts or redeploys.

#### How It Works in This Project
1. When a customer calls `POST /order`, `_create_order_in_firestore(item, quantity)` is invoked.
2. It executes an atomic Firestore transaction against `metadata/order_counter`:
   ```python
   @gcp_firestore.transactional
   def _txn_step(txn):
       snapshot = counter_ref.get(transaction=txn)
       current_id = snapshot.get("last_order_id") or 0 if snapshot.exists else 0
       next_order_id = current_id + 1
       txn.set(counter_ref, {"last_order_id": next_order_id, "updated_at": gcp_firestore.SERVER_TIMESTAMP}, merge=True)
       order_ref = _gcp_firestore_client.collection("orders").document(str(next_order_id))
       txn.set(order_ref, {"order_id": next_order_id, "item": item, "quantity": quantity, "status": "Order Placed", "created_at": gcp_firestore.SERVER_TIMESTAMP})
       return next_order_id
   ```
3. Upon commit, the actual stored `created_at` timestamp is read back from Firestore and converted to IST.
4. **Guarantees**: Order IDs continue monotonically (`Order #1`, `Order #2`, `Order #3`...) permanently, regardless of days passed, instance restarts, or scale-to-zero events.

### Pillar 2: Dynamic Rolling 7-Day Logs Engine & Controlled Queue Delivery

#### The Problem Solved
Many monitoring dashboards either fetch all logs since the beginning of time (slow, expensive) or rely on local memory buffers (lost upon restart).

#### How It Works in This Project
1. **Log Retention Governance**: The application does not delete Google Cloud logs. The dashboard displays a dynamic rolling 7-day observability window (`timestamp >= now - 7 days`). Actual log retention is governed by the configured Google Cloud Logging bucket retention policy (by default 30 days for `_Default` buckets in GCP, or custom retention periods configured in Log Router sinks).
2. **Server-Side Rolling Time Window**: Whenever the dashboard queries `/api/monitoring/logs`, the backend evaluates the exact current second:
   ```python
   cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
   cutoff_str = cutoff.strftime("%Y-%m-%dT%H:%M:%SZ")
   filter_str = f'logName="projects/{GCP_PROJECT}/logs/{GCP_LOG_NAME}" timestamp >= "{cutoff_str}"'
   ```
3. **Continuous Rolling**: 
   * As time advances second-by-second, the 7-day lower boundary advances automatically.
   * Logs older than 7 days automatically roll out of the dashboard view.
   * New logs appear instantly upon ingestion.

#### Asynchronous Queue Saturation & Controlled Delivery Policy
Application events are asynchronously delivered to Google Cloud Logging. Queue saturation and write failures are explicitly handled with controlled fallback and/or bounded retry logic. Guaranteed delivery is not claimed unless independently implemented and verified.
* **Bounded Retry on Write Failure**: If a write to Google Cloud Logging fails, the background writer retries up to 3 times with exponential backoff. Upon retry exhaustion, the failure is explicitly recorded to application stderr and an atomic failure counter (`_log_delivery_failures`) is incremented.
* **Never Silently Remove Queued Logs**: The system never silently removes an existing queued log to make space for a new one (all silent drop behaviors like `_write_queue.get_nowait()` have been removed).
* **Synchronous Fallback on Queue Saturation**: On queue saturation, first attempt synchronous delivery to Google Cloud Logging. If delivery fails, explicitly record the failure locally/application stderr and increment a failure counter. Never silently remove an existing queued log to make space for a new one.
* **Production Scalability Roadmap**: For massive, sustained enterprise traffic surges beyond container memory limits, a production-grade architecture would transition the buffering layer to Google Cloud Pub/Sub or Google Cloud Tasks.

### Pillar 3: Two-Tier Alert Lifecycle & Acknowledgment

The dashboard divides incident management into two clearly delineated sections:

```text
New ERROR Log in Google Cloud
               |
               v
    +--------------------+
    |  🔴 ACTIVE ALERT   |  --> Appears in Section A (Active Alerts) with red badge
    +----------+---------+  --> Appears in Section B (Alert History) marked as 🔴 ACTIVE
               |
    Developer reviews & clicks "✓ Acknowledge"
               |
               v
    +--------------------+
    |  ✓ ACKNOWLEDGED    |  --> Removed from Section A; shows "✓ All Systems Operational"
    +--------------------+  --> Stays in Section B (Alert History) marked as ✓ ACKNOWLEDGED
                            --> Log remains 100% intact in Google Cloud Logging (never deleted)
```

#### Canonical Identity Matching (`alert_id`)
* Every GCP log has a unique, canonical `insert_id`.
* The dashboard maps acknowledgements strictly using this canonical `alert_id`:
   ```python
   ack_map[str(canonical_id)] = {
       "status": "ACKNOWLEDGED",
       "acknowledged_at": formatted_ist_time
   }
   ```
* Firestore document sanitization (`_safe_doc_id`) is strictly confined to `.document(safe_id)` paths to prevent slash errors, ensuring `Google Logging ID == Firestore Data ID` everywhere.

#### Dual-Layer Firestore TTL Auto-Cleanup & Strict Lifecycle Alignment
To prevent acknowledged alerts from accumulating in Firestore indefinitely after their 7-day log window expires:
1. **Strict Lifecycle Alignment (`expires_at = alert_timestamp + 7 days`)**:
   - Google Cloud Logging retains and filters error events in a rolling 7-day window (`timestamp >= now - 7 days`).
   - If an alert occurs on Day 1 and is acknowledged on Day 6, setting `expires_at` based on the acknowledgement time would keep stale data until Day 13 (5 days after the log left the dashboard).
   - By calculating:
     $$\text{expires\_at} = \text{alert\_timestamp} + 7\text{ days}$$
     the Firestore acknowledgement expires at the exact moment the original log event rolls out of the 7-day observability window, keeping both systems in 100% synchrony.
   - **Strict Rejection on Unresolvable Timestamp**: The backend validates the original alert event timestamp from the request payload, the cached logs pool, or a direct GCP `list_entries` lookup by `insertId`. If the original timestamp cannot be resolved, the request is rejected with HTTP 422 (`{"error": "Original alert timestamp could not be resolved"}`), strictly forbidding any silent fallback to `now_utc`.
2. **Native Cloud TTL Policy**: GCP Firestore TTL policy is active on `collectionGroups/acknowledged_alerts/fields/expires_at` (`state: ACTIVE`) for automated background document deletion.
3. **Application-Layer Active Pruning**: Because Firestore background TTL deletion is asynchronous, `_get_acknowledged_alerts_map()` proactively filters out any document where `expires_at <= now_utc`, guaranteeing immediate expiration even before background deletion occurs.

### Pillar 4: Real-Time Infrastructure Metrics (100% Real GCP)

Infrastructure metrics displayed by the dashboard are sourced directly from **Google Cloud Monitoring v3**:
* **Latest Observation Point Selection**: Metric points are evaluated chronologically using the metric interval's `end_time`. The dashboard reports the latest genuine observation point rather than historical peak (`max()`) values over the lookback window.
* **CPU Utilization**: Real metric from `run.googleapis.com/container/cpu/utilizations` (latest distribution mean converted to percentage). All artificial multipliers (such as `* 0.85`) and fake fallback constants are strictly purged.
* **Genuine Zero Preservation**: Real zero values (e.g. `0.0% CPU`, `0 MB memory`, `0 active instances`) are preserved and displayed as genuine observations (`0.0%` / `0`), never conflated with missing data (`null`).
* **Dynamic Memory Limit Detection**: Instead of assuming or hardcoding memory sizes, `_get_container_memory_limit_mb()` dynamically reads container cgroup limits (`/sys/fs/cgroup/memory.max` or `/sys/fs/cgroup/memory/memory.limit_in_bytes`). If the limit cannot be determined, it returns `None` rather than falling back to an assumed value.
* **Memory Calculation & Missing Telemetry**:
  $$\text{Real Memory Used (MB)} = \left(\frac{\text{GCP Memory \%}}{100}\right) \times \text{Actual Configured Limit (MB)}$$
  If either the GCP memory utilization percentage or the detected container memory limit is unavailable, the system reports `memory_pct: null`, `memory_mb: null`, `memory_total_mb: null`, and `display: "N/A"` (never fabricating 0% or an assumed total).
* **Container Instance Count**: Directly queries `run.googleapis.com/container/instance_count` across container states (`active` vs `idle`) to report the latest active container instances from GCP.
* **Missing Idle Telemetry Honesty**: When Google Cloud Monitoring does not return idle instance data, the backend returns `idle_instances: null` and the frontend displays `N/A`, strictly avoiding fabricating `0 Idle Instances`.
* **Zero Fabricated Fallbacks**: All hardcoded fallback numbers (such as `1.2% CPU`, `27.6% Memory`, `141 MB`, `512 MB`, `1 instance`, `0 idle`) and local `psutil` simulated stand-ins have been completely eliminated.
* **Honest Handling of Missing Telemetry**: If Google Cloud Monitoring returns no telemetry data for a metric, the API explicitly returns `null` with structured status (`any_core_metric_missing`, `all_core_metrics_missing`), and the dashboard displays `N/A` with visually neutral progress indicators rather than misleading low-usage bars.
* **Estimated Monthly Cost Status**: The application is not connected to the Google Cloud Billing API. The hardcoded `$12.4` figure has been removed; the API returns `estimated_monthly_cost: null`, `cost_display: "N/A"`, and `cost_source: "not-connected"`. Cost-efficiency optimization suggestions in the UI are presented as infrastructure sizing recommendations, not billed accounting facts.
* **Parallel Fetching & Caching**: Queries are executed concurrently across worker threads using `concurrent.futures.ThreadPoolExecutor` with a thread-safe `threading.RLock()` cache (2-second TTL) to deliver fast responses without stacking GCP API calls.

### Pillar 5: Standardized Indian Standard Time (IST — Asia/Kolkata)

Every visible date and time across both the Customer Portal and Developer Dashboard conforms strictly to the standardized format:
```text
DD-Mon-YYYY hh:mm:ss AM/PM IST
Example: 06-Sep-2026 08:30:15 PM IST
```

#### Centralized Implementation
In `app.py`:
```python
from zoneinfo import ZoneInfo
IST = ZoneInfo("Asia/Kolkata")

def format_ist_timestamp(ts) -> str:
    if ts is None: return None
    # Converts UTC datetimes, ISO strings, epoch floats, or Firestore timestamps
    ...
    return dt.astimezone(IST).strftime("%d-%b-%Y %I:%M:%S %p IST")
```

#### Where IST is Enforced:
1. **Google Cloud Log timestamps**: Converted on-the-fly from UTC to IST upon reading.
2. **Active Alert Detection time**: Formatted in IST.
3. **Alert History**: Both `Detected` time and `Acknowledged` time formatted in IST.
4. **Order API**: `POST /order` and `GET /order/<id>` return the exact committed Firestore `created_at` timestamp in IST.
5. **Dashboard Charts**: Time axis labels render in `Asia/Kolkata` time with IST indicators.

## 5. Lifecycle Behavior: From Startup to Peak Traffic

### Phase 1: Zero Traffic / Offline (Scale to Zero)
* **What happens**: Cloud Run notices 0 incoming HTTP requests for ~15 minutes and scales active container instances down to **0**.
* **Resource consumption**: 0 CPU, 0 RAM, 0 cloud cost.
* **Data integrity**: All past logs remain in Google Cloud Logging; all order numbers and acknowledged alerts remain in Firestore.

### Phase 2: Cold Start (First Visitor Arrives)
* A user hits `https://...run.app/shop` or `/developer/dashboard`.
* Cloud Run automatically boots a container in ~1.5 to 2.5 seconds.
* The container initializes GCP clients lazily via `_init_gcp()`.
* The dashboard evaluates `now() - 7 days` and loads all logs from the past 7 days instantly.

### Phase 3: Live Active Operation (Configurable Polling)
* Once the Developer Dashboard is open in a browser:
  * **Logs Polling**: Configured via `LOG_POLL_INTERVAL_MS` (default 5000 ms; demo mode 1000 ms).
  * **Metrics Polling**: Configured via `METRICS_POLL_INTERVAL_MS` (default 5000 ms; demo mode 2500 ms).
  * **In-Flight Lock Guards**: `_isFetchingLogs` and `_isFetchingMetrics` prevent request stacking if network latency spikes.
  * **Zero-Flicker DOM Updates**: Only new log rows are prepended to the table, avoiding DOM clearing and page redraws.

### Phase 4: Peak Traffic & Multi-Instance Auto-Scaling
* If traffic surges (e.g. flash sale), Cloud Run automatically spawns multiple parallel container instances.
* **Order IDs Never Collide**: Because order increments use Firestore atomic transactions (`metadata/order_counter`), instances never issue duplicate order IDs.
* **Logs Stay Unified**: Every instance streams logs directly into the centralized Google Cloud Logging stream.

## 8. Verification & Testing Playbook

To verify this application end-to-end, execute the following automated steps:

1. **Verify IST Timestamps**:
   Query `/api/monitoring/logs` and assert that all timestamp fields match regex `^\d{2}-[A-Za-z]{3}-\d{4} \d{2}:\d{2}:\d{2} (AM|PM) IST$`.
2. **Verify Order Persistence**:
   Call `POST /order` to create an order. Confirm the sequential ID incremented and `created_at` matches the exact value from `GET /order/<id>`.
3. **Verify Alert Lifecycle**:
   With `ENABLE_ERROR_SIMULATION=true`, call `POST /api/simulate-error`. Confirm an active alert appears with `status: ACTIVE`. Call `POST /api/monitoring/alerts/acknowledge` passing the `alert_id`. Confirm the alert transitions to `status: ACKNOWLEDGED` with an IST `acknowledged_at` timestamp and disappears from the Active Alerts section.
4. **Verify Telemetry Authenticity**:
